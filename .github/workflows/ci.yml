name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Test
        run: swift test

      - name: Build universal app
        run: ./scripts/build-app.sh --zip

      - name: Smoke test
        run: |
          codesign --verify --strict build/Seamline.app
          lipo -archs build/Seamline.app/Contents/MacOS/Seamline | grep -q x86_64
          lipo -archs build/Seamline.app/Contents/MacOS/Seamline | grep -q arm64

      - uses: actions/upload-artifact@v4
        with:
          name: Seamline-app
          path: build/Seamline-*.zip
          retention-days: 7
