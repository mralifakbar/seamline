name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Test
        run: swift test

      - name: Build universal app
        run: VERSION="${GITHUB_REF_NAME#v}" ./scripts/build-app.sh --zip

      - name: Checksum
        working-directory: build
        run: shasum -a 256 Seamline-*.zip | tee SHA256SUMS.txt

      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="[$version]" '/^## \[/ { p = index($0, v) > 0; next } /^\[[^]]+\]: / { p = 0 } p' CHANGELOG.md > notes.md
          {
            echo
            echo "### Install"
            echo
            echo "1. Download **Seamline-${version}.zip**, unzip it, and move **Seamline.app** to Applications. Do this on every Mac."
            echo "2. Open it. macOS blocks it the first time because the app is not notarized. Go to **System Settings › Privacy & Security**, scroll down, and click **Open Anyway** next to the Seamline message."
            echo "   Or run \`xattr -dr com.apple.quarantine /Applications/Seamline.app\` once."
            echo "3. Follow the setup in the [README](https://github.com/mralifakbar/seamline#set-up)."
            echo
            echo "This build is signed ad-hoc, so after updating to a new version, switch Seamline off and on again under Accessibility and Input Monitoring."
            echo
            echo "SHA-256:"
            echo '```'
            cat build/SHA256SUMS.txt
            echo '```'
          } >> notes.md
          cat notes.md

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/Seamline-*.zip build/SHA256SUMS.txt \
            --title "Seamline ${GITHUB_REF_NAME#v}" --notes-file notes.md --verify-tag
